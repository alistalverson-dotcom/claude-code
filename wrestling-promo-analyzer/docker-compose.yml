version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:12
    container_name: promo_analyzer_postgres
    environment:
      POSTGRES_DB: promo_analyzer
      POSTGRES_USER: promo_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promo_admin -d promo_analyzer"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - promo_network

  # Redis Message Broker
  redis:
    image: redis:7-alpine
    container_name: promo_analyzer_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - promo_network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: promo_analyzer_backend
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - ./uploads/processed:/app/uploads/processed
    environment:
      # Database
      DATABASE_URL: postgresql://promo_admin:${POSTGRES_PASSWORD:-changeme123}@postgres:5432/promo_analyzer
      POSTGRES_USER: promo_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme123}
      POSTGRES_DB: promo_analyzer

      # Redis & Celery
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

      # Application
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}

      # File Storage
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_SIZE_MB: 500
      ALLOWED_VIDEO_FORMATS: mp4,mov,avi,mkv

      # Video Processing
      FFMPEG_PATH: ffmpeg
      WHISPER_MODEL: base
      WHISPER_DEVICE: cpu

      # AI
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: claude-sonnet-4-20250514
      ANTHROPIC_MAX_TOKENS: 4000
      ANTHROPIC_TEMPERATURE: 0.7

      # CORS
      CORS_ORIGINS: http://localhost:3000,http://localhost:8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - promo_network

  # Celery Worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: promo_analyzer_celery
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - ./uploads/processed:/app/uploads/processed
    environment:
      # Database
      DATABASE_URL: postgresql://promo_admin:${POSTGRES_PASSWORD:-changeme123}@postgres:5432/promo_analyzer
      POSTGRES_USER: promo_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme123}
      POSTGRES_DB: promo_analyzer

      # Redis & Celery
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

      # Application
      APP_ENV: ${APP_ENV:-development}

      # File Storage
      UPLOAD_DIR: /app/uploads

      # Video Processing
      FFMPEG_PATH: ffmpeg
      WHISPER_MODEL: base
      WHISPER_DEVICE: cpu

      # AI
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: claude-sonnet-4-20250514
      ANTHROPIC_MAX_TOKENS: 4000
      ANTHROPIC_TEMPERATURE: 0.7
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A tasks worker --loglevel=info --concurrency=2
    networks:
      - promo_network

  # Flower (Celery Monitoring) - Optional
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: promo_analyzer_flower
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery_worker
    command: celery -A tasks flower --port=5555
    networks:
      - promo_network

  # React Frontend (Development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: promo_analyzer_frontend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
      CHOKIDAR_USEPOLLING: true
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    networks:
      - promo_network

volumes:
  postgres_data:
    driver: local

networks:
  promo_network:
    driver: bridge
